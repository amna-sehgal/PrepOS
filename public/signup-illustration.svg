<defs>
<style>
svg.animated .animable {opacity: 1;}
svg.animated #freepik--background-simple--inject-56 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) zoomIn;}
svg.animated #freepik--Checklists--inject-56 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) zoomOut;}
svg.animated #freepik--Envelopes--inject-56 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) slideDown;}
svg.animated #freepik--Floor--inject-56 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) slideDown;}
svg.animated #freepik--Plants--inject-56 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) slideLeft;}
svg.animated #freepik--Screen--inject-56 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) slideDown;}
svg.animated #freepik--Mail--inject-56 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) slideRight;}
svg.animated #freepik--Character--inject-56 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) fadeIn;}
svg.animated #freepik--speech-bubble--inject-56 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) lightSpeedRight;}
@keyframes zoomIn {0% {opacity: 0;transform: scale(0.5);}100% {opacity: 1;transform: scale(1);}}
@keyframes zoomOut {0% {opacity: 0;transform: scale(1.5);}100% {opacity: 1;transform: scale(1);}}
@keyframes slideDown {0% {opacity: 0;transform: translateY(-30px);}100% {opacity: 1;transform: translateY(0);}}
@keyframes slideLeft {0% {opacity: 0;transform: translateX(-30px);}100% {opacity: 1;transform: translateX(0);}}
@keyframes lightSpeedLeft {from {transform: translate3d(-50%, 0, 0) skewX(20deg);opacity: 0;}60% {transform: skewX(-10deg);opacity: 1;}80% {transform: skewX(2deg);}to {opacity: 1;transform: translate3d(0, 0, 0);}}
@keyframes slideRight {0% {opacity: 0;transform: translateX(30px);}100% {opacity: 1;transform: translateX(0);}}
@keyframes fadeIn {0% {opacity: 0;}100% {opacity: 1;}}
@keyframes lightSpeedRight {from {transform: translate3d(50%, 0, 0) skewX(-20deg);opacity: 0;}60% {transform: skewX(10deg);opacity: 1;}80% {transform: skewX(-2deg);}to {opacity: 1;transform: translate3d(0, 0, 0);}}
</style>
